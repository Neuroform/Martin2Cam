name: Martin2Cam
options:
  bundleIdPrefix: at.martin
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  Martin2Cam:
    type: application
    platform: iOS
    sources: [Martin2Cam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.martin.Martin2Cam
        PRODUCT_NAME: Martin2Cam
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_CFBundleDisplayName: Martin2Cam
        INFOPLIST_KEY_NSCameraUsageDescription: "Martin2Cam benötigt Kamerazugriff für die angeschlossenen USB-Dokumentenkameras."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
