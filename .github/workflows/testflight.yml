name: TestFlight Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Ruby dependencies
        run: bundle install

      - name: Validate App Store Connect secrets
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | openssl pkcs8 -nocrypt >/dev/null

      - name: Remove orphaned CI distribution certificate
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          bundle exec ruby <<'RUBY'
          require "jwt"
          require "openssl"
          require "net/http"
          require "json"

          key = OpenSSL::PKey::EC.new(ENV.fetch("APP_STORE_CONNECT_PRIVATE_KEY"))
          now = Time.now.to_i
          payload = {
            iss: ENV.fetch("APP_STORE_CONNECT_ISSUER_ID"),
            iat: now,
            exp: now + 600,
            aud: "appstoreconnect-v1"
          }
          token = JWT.encode(payload, key, "ES256", { kid: ENV.fetch("APP_STORE_CONNECT_KEY_ID"), typ: "JWT" })

          cert_id = ENV.fetch("ORPHAN_CERT_ID", "C8BC5JP588")
          uri = URI("https://api.appstoreconnect.apple.com/v1/certificates/#{cert_id}")
          req = Net::HTTP::Delete.new(uri)
          req["Authorization"] = "Bearer #{token}"
          res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }

          unless ["204", "404"].include?(res.code)
            warn "Certificate cleanup failed: HTTP #{res.code} #{res.body}"
            exit 1
          end
          puts res.code == "204" ? "Removed orphaned certificate #{cert_id}." : "Orphaned certificate already absent."
          RUBY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build signed IPA and upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bundle exec fastlane ios testflight

      - name: Upload signed IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Martin2Cam-TestFlight-build
          path: |
            artifacts
            fastlane/report.xml
            ~/Library/Logs/gym
